# API process only (Anexo J). No Postgres container. Engine: drp-infra-postgres.

name: ${COMPOSE_PROJECT_NAME:-drp-dev}

services:
  space-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: drp-space-api
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8082}
      SERVICE_NAME: ${SERVICE_NAME:-space-service}
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-http://identity-api:8081/api/v1/auth/jwks}
    ports:
      - "${HTTP_PORT:-8082}:8082"
    networks:
      - pg

networks:
  pg:
    name: ${SPACE_API_NETWORK:-drp-dev_default}
    external: true
